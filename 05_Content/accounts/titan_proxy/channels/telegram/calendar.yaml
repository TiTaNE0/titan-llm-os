# Titan Proxy — Autonomous Annual Content & Promo Calendar (`@TitanMTProxyNews`)
#
# Agents evaluate this calendar on every batch run (zero human approval required).
# Within `promo_guardrails`, the Agent Council (`approval_council`) autonomously
# moves upcoming events within `lead_days` from `planned` -> `active`, generates
# `content/promos.json` + time-windowed posts + seasonal media, and enforces all gates.

timezone: Europe/Moscow

autonomous_policy:
  human_approval_required: false
  approval_council:
    - strategist
    - tech_fact_critic
    - growth_calendar_critic
    - deterministic_gate
  promo_guardrails:
    min_bonus_days: 5
    max_bonus_days: 14
    price_changes_allowed: false
    max_window_days: 20
    one_redemption_per_user: true

